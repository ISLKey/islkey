; ISLKey Door Controller Firmware
; Four build targets — select the one matching your hardware

[common]
platform  = espressif32
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    h2zero/NimBLE-Arduino @ ^1.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=1

; ── ISLKey Relay Board (AliExpress WROOM dual relay, DC5-60V) ────────────────
[env:relay-board]
extends             = common
board               = esp32dev
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = min_spiffs.csv
build_flags         = ${common.build_flags} -DBOARD_RELAY

; ── ESP32 DevKit V1 (38-pin development board) ───────────────────────────────
[env:devkit]
extends             = common
board               = esp32dev
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
build_flags         = ${common.build_flags} -DBOARD_DEVKIT

; ── TTGO T-Display (ESP32 with 1.14" colour LCD) ────────────────────────────
[env:ttgo]
extends             = common
board               = esp32dev
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
build_flags         = ${common.build_flags} -DBOARD_TTGO
lib_deps            =
    ${common.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.0
; TFT_eSPI needs User_Setup.h in its library folder configured for TTGO T-Display
; Use the TTGO_T_Display definition in User_Setup_Select.h

; ── WT32-ETH01 (Ethernet + PoE board) ──────────────────────────────────────
[env:wt32-eth01]
extends             = common
board               = wt32-eth01
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
build_flags         = ${common.build_flags} -DBOARD_WT32_ETH01
